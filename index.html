<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach's Counter-Defense Playbook</title>
    <style>
        :root {
            --primary: #ff6600;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --text-muted: #b0b0b0;
        }
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: var(--bg); color: var(--text); text-align: center; }
        h1 { margin-bottom: 5px; }
        p.subtitle { color: var(--text-muted); margin-bottom: 25px; }
        
        .defense-selector { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 25px; }
        .def-btn { background: #2d2d2d; color: var(--text); border: 2px solid #444; padding: 10px 18px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .def-btn:hover, .def-btn.active { background: var(--primary); border-color: var(--primary); }

        .play-card { background: var(--card-bg); border-radius: 12px; max-width: 600px; margin: 0 auto; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: left; }
        .play-title { font-size: 20px; color: var(--primary); margin-top: 0; }
        
        .court-diagram { width: 100%; height: 220px; background: #d28c46; border: 3px solid #fff; border-radius: 6px; position: relative; margin-bottom: 15px; overflow: hidden; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #333; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
        
        .instructions { font-size: 14px; line-height: 1.6; color: var(--text-muted); margin-bottom: 20px; }
        .instructions ul { padding-left: 20px; margin: 5px 0; }

        .play-links { display: flex; gap: 10px; }
        .action-link { flex: 1; background: #333; color: var(--text); text-decoration: none; padding: 10px; text-align: center; border-radius: 6px; font-size: 14px; font-weight: bold; transition: 0.2s; }
        .action-link:hover { background: #444; color: var(--primary); }
    </style>
</head>
<body>

    <h1>Tactical Matchup Finder</h1>
    <p class="subtitle">Select the opponent's defense to instantly view counter-plays and diagrams.</p>

    <div class="defense-selector">
        <button class="def-btn active" onclick="selectDefense('zone23', this)">2-3 Zone</label>
        <button class="def-btn" onclick="selectDefense('zone131', this)">1-3-1 Zone</button>
        <button class="def-btn" onclick="selectDefense('manc2man', this)">Man-to-Man</button>
        <button class="def-btn" onclick="selectDefense('press', this)">Full-Court Press</button>
    </div>

    <div class="play-card" id="playCardDisplay">
        <h2 class="play-title" id="playTitle">Loading Play...</h2>
        <div class="court-diagram" id="playDiagram">Half-Court Diagram</div>
        <div class="instructions" id="playInstructions">Select a defense above to review the playbook strategy.</div>
        <div class="play-links">
            <a href="#" class="action-link" onclick="alert('Opening full video breakdown...'); return false;">▶ Watch Play Video</a>
            <a href="#" class="action-link" onclick="alert('Exporting play to PDF/Clipboard...'); return false;">📋 Export Playbook</a>
        </div>
    </div>

    <script>
        const playbookData = {
            zone23: {
                title: "1-4 High Overload Attack",
                diagramText: "2-3 Zone Breakdown: High Post Entry",
                steps: [
                    "<b>Goal:</b> Collapse the zone low and create a 2-on-1 advantage at the elbow.",
                    "<b>Execution:</b> Set guards at the wings, place a forward at the high post (elbow), and move the center to the short corner.",
                    "<b>Primary Read:</b> Pass to the high post forces the zone center to step up, freeing the short corner baseline cut for an uncontested layup."
                ]
            },
            zone131: {
                title: "Short Corner & Deep Wings Set",
                diagramText: "1-3-1 Zone Attack: Guarding the Apex",
                steps: [
                    "<b>Goal:</b> Neutralize the aggressive trapping chaser at the top of the key.",
                    "<b>Execution:</b> Spread players immediately to the deep corners and long wings to stretch the single-defender baseline coverage.",
                    "<b>Primary Read:</b> Quick skip pass from wing to corner forces the sliding wing defender out of position, opening interior passing lanes."
                ]
            },
            manc2man: {
                title: "Horns Flex Screen Continuity",
                diagramText: "Man-to-Man: High Screen & Roll",
                steps: [
                    "<b>Goal:</b> Force switches or create separation using staggered screens away from the ball.",
                    "<b>Execution:</b> Point guard initiates from the top in Horns alignment, receiving a double screen at the elbow.",
                    "<b>Primary Read:</b> Look for the roll-man diving to the rim or kick out to the shooter popping to the wing."
                ]
            },
            press: {
                title: "1-2-1-1 Diamond Press Break",
                diagramText: "Full-Court Press: Overcoming the Trap",
                steps: [
                    "<b>Goal:</b> Safely advance the ball past half-court without committing a 10-second violation.",
                    "<b>Execution:</b> Position an inbounder, a safety flash option in the middle, two wing guards along sideline corridors, and a deep safety.",
                    "<b>Primary Read:</b> Pass to the middle flash option immediately splits the trap and turns defense into a 4-on-3 fast break."
                ]
            }
        };

        function selectDefense(defenseKey, btnElement) {
            // Update active button styles
            document.querySelectorAll('.def-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            // Load data into card
            const data = playbookData[defenseKey];
            document.getElementById('playTitle').innerText = data.title;
            document.getElementById('playDiagram').innerText = data.diagramText;
            
            let listHtml = "<ul>";
            data.steps.forEach(step => {
                listHtml += `<li>${step}</li>`;
            });
            listHtml += "</ul>";
            
            document.getElementById('playInstructions').innerHTML = listHtml;
        }

        // Initialize default view
        selectDefense('zone23', document.querySelector('.def-btn'));
    </script>

</body>
</html>
